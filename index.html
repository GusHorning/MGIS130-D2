<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Sparks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bgLayer" class="bg-layer bg-sports"></div>

<div class="app-container">
  <header class="app-header">
    <h1>Daily Sparks</h1>
    <p class="subtitle">Unexpected wisdom from athletes, films, and philosophers</p>
  </header>

  <nav class="category-selector" aria-label="Category">
    <button class="tab-btn active" data-category="sports">⚡ Sports</button>
    <button class="tab-btn" data-category="film">🎬 Film</button>
    <button class="tab-btn" data-category="philosophy">🏛️ Philosophy</button>
  </nav>

  <div class="toolbar">
    <button id="savedBtn" class="tool-btn">♥ Saved (<span id="savedCount">0</span>)</button>
    <button id="helpBtn" class="tool-btn">? How it works</button>
  </div>

  <button id="generateBtn" class="generate-btn theme-sports">⚡ Discover Sports Spark</button>

  <main id="displayCard" class="card theme-sports">
    <div class="media-container">
      <img id="mediaBlur" class="media-blur" alt="" aria-hidden="true">
      <img id="authorAvatar" class="author-avatar" alt="">
      <span id="categoryBadge" class="category-badge"></span>
      <span id="leagueBadge" class="league-badge"></span>
      <button id="favBtn" class="fav-btn" aria-pressed="false" aria-label="Save to favorites">♡</button>
    </div>

    <div class="card-body">
      <blockquote class="quote-block">
        <p id="quoteText" class="quote-text"></p>
        <footer id="quoteAuthor" class="quote-author"></footer>
      </blockquote>

      <button id="insightToggle" class="insight-toggle" aria-expanded="false">
        <span>💡 Further Insight</span><span id="toggleIcon">▼ Reveal</span>
      </button>
      <div id="insightBox" class="insight-box hidden">
        <div class="insight-header">Further Insight</div>
        <p id="insightText" class="insight-text"></p>
      </div>

      <div class="fact-block">
        <div class="fact-title">Historical Snapshot</div>
        <p id="factText" class="fact-text"></p>
      </div>

      <button id="exploreBtn" class="explore-btn">🔍 Learn more about this mind and context</button>
    </div>
  </main>

  <footer class="app-footer">Daily Sparks • Photos from Wikipedia when available</footer>
</div>

<div id="detailModal" class="detail-modal" aria-hidden="true">
  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <button id="closeModal" class="close-modal-btn" aria-label="Close">✕</button>
    <header class="modal-header">
      <span id="modalBadge" class="category-badge static"></span>
      <img id="modalImg" class="modal-img" alt="">
      <h2 id="modalName"></h2>
      <p id="modalRole" class="modal-role"></p>
    </header>
    <div class="modal-body">
      <section class="modal-section"><h3>🧠 Mindset &amp; Philosophy</h3><p id="modalBeliefs"></p></section>
      <section class="modal-section"><h3>🏆 Key Achievements &amp; Impact</h3><p id="modalAchievements"></p></section>
      <section class="modal-section"><h3>🍿 Context &amp; Trivia</h3><p id="modalTrivia"></p></section>
    </div>
    <button id="backBtn" class="back-btn">← Back to quotes</button>
  </div>
</div>

<div id="savedModal" class="detail-modal" aria-hidden="true">
  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="savedTitle">
    <button class="close-modal-btn" data-close aria-label="Close">✕</button>
    <h2 id="savedTitle" class="modal-title">♥ Your saved quotes</h2>
    <div id="savedList"></div>
    <button class="back-btn" data-close>← Back to quotes</button>
  </div>
</div>

<div id="onboardModal" class="detail-modal" aria-hidden="true">
  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="onboardTitle">
    <button class="close-modal-btn" data-close aria-label="Skip tour">✕</button>
    <div class="onboard-step">
      <div id="onboardIcon" class="onboard-icon"></div>
      <h2 id="onboardTitle"></h2>
      <p id="onboardText"></p>
    </div>
    <div id="dots" class="dots"></div>
    <div class="onboard-nav">
      <button id="onboardPrev" class="small-btn">Back</button>
      <button id="onboardNext" class="back-btn">Next</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
